# ============================================================
# 外汇量化交易 — crontab 调度配置
# ============================================================
# 用法: crontab .hermes/crontab.conf
#   或: crontab -e 然后粘贴内容
# ============================================================
#
# 监控时间窗口（你的作息）:
#   🌙 05:00  — 自动采集（美盘收市）
#   🌅 07:30  — 🔴 看早间信号，决定今日挂单
#   🌏 09:00  — 自动采集（中国开）
#   🌃 22:00  — 🔴 看晚间简报，检查持仓
#   🟤 22:00(周五) — 检查周末跳空风险
#
# 路径说明: 把下面所有 /path/to/ 替换为实际路径
#   实际路径: /Users/mac/Documents/外汇量化交易
# ============================================================

# ────────────────────────────────────────
# 环境变量（cron 默认 PATH 可能不够）
# ────────────────────────────────────────
SHELL=/bin/bash
PATH=/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin
PROJ=/Users/mac/Documents/外汇量化交易

# ────────────────────────────────────────
# 数据采集（后台自动运行）
# ────────────────────────────────────────

# M15 数据 — 每 15 分钟
*/15 5-23 * * 1-5 cd $PROJ && .venv/bin/python3 -c "from src.data_collection.oanda import OandaClient; c=OandaClient(); d=c.fetch_candles('M15',5); c.save_candles(d,'M15')" >/dev/null 2>&1

# H1/H4 数据 — 每小时
0 * * * 1-5 cd $PROJ && .venv/bin/python3 -c "from src.data_collection.oanda import OandaClient; c=OandaClient(); [c.save_candles(c.fetch_candles(t,3),t) for t in ['H1','H4']]" >/dev/null 2>&1

# D1 数据 + 经济日历 — 每天 06:00
0 6 * * 1-5 cd $PROJ && .venv/bin/python3 -c "
from src.data_collection.oanda import OandaClient
from src.data_collection.calendar import EconomicCalendar
c=OandaClient(); c.save_candles(c.fetch_candles('D1',5),'D1')
EconomicCalendar().collect_and_save()
"

# 新闻 — 每 2 小时（需代理开启）
0 */2 * * 1-5 cd $PROJ && .venv/bin/python3 -c "from src.data_collection.news_collector import NewsCollector; nc=NewsCollector(); nc.save(nc.fetch_feeds())" >/dev/null 2>&1

# ────────────────────────────────────────
# 早间信号（07:30 — 你起床看）
# ────────────────────────────────────────
30 7 * * 1-5 cd $PROJ && bash scripts/cron_morning.sh

# ────────────────────────────────────────
# 晚间简报（22:00 — 睡前检查）
# ────────────────────────────────────────
0 22 * * 1-5 cd $PROJ && bash scripts/cron_evening.sh

# ────────────────────────────────────────
# 周五特检（22:00 — 检查周末跳空风险）
# ────────────────────────────────────────
# 周五已包含在 22:00 简报中，自动检查 weekend gap
# 无需单独配置

# ────────────────────────────────────────
# 每日复盘（可选 — 次日 08:30 跑）
# ────────────────────────────────────────
30 8 * * 1-5 cd $PROJ && bash scripts/cron_review.sh 1

# ────────────────────────────────────────
# 你的操作时间表
# ────────────────────────────────────────
#
# 🕐 07:00  起床 → 打开手机看早间信号
#      系统已生成: 📊 EUR/USD 交易信号
#                 + 📰 基本面摘要
#      你做: 决定今日是否挂单
#
# 🕐 09:00  中国开盘（无需操作，系统自动）
#
# 🕐 15:00  欧洲开盘（无需操作，系统自动）
#
# 🕐 22:00  睡前 → 看晚间简报
#      系统已生成: 🌙 EUR/USD 晚间简报
#      你做: 检查持仓/挂单，决定是否调整
#
# 🕐 周五 22:00  + 周末跳空风险检查
#      有数据→撤单 | 无数据→正常持仓
